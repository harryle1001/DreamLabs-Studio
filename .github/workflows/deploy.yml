# Mỗi lần đẩy code lên main: đóng gói bản nén rồi đẩy sang repo công khai chạy GitHub Pages.
# Cần: secret DEPLOY_TOKEN (fine-grained token, quyền Contents: Read and write trên repo đích).
# Tên repo đích lấy từ biến SITE_REPO (Settings → Secrets and variables → Actions → Variables), mặc định dreamlabs-web.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài công cụ đóng gói
        run: npm ci --no-audit --no-fund

      - name: Đóng gói bản nén
        run: npm run dist

      - name: Đẩy sang repo công khai
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          SITE_REPO: ${{ vars.SITE_REPO || 'dreamlabs-web' }}
        run: |
          if [ -z "$TOKEN" ]; then echo "Chưa có secret DEPLOY_TOKEN"; exit 1; fi
          cd dist
          printf '# Dream Labs\n\nWebsite https://dreamlabs.vn\n' > README.md
          git init -q -b main
          git config user.name "dreamlabs-deploy"
          git config user.email "dreamlabs-deploy@users.noreply.github.com"
          git add -A
          git commit -q -m "Cập nhật website ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/${SITE_REPO}.git" main
