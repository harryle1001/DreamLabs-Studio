<section class="proc" id="quy-trinh">
  <div class="proc-pin" id="procPin">
    <div class="proc-sticky">
      <div class="wrap">
        <div class="sec-head">
          <div><p class="eyebrow">Quy trình</p><h2 data-split>Năm bước, <em>không bất ngờ.</em></h2></div>
          <p class="lead" data-reveal>Bạn luôn biết dự án đang ở đâu, ai phụ trách và khi nào bàn giao.</p>
        </div>
      </div>
      <div class="proc-view" id="procView">
        <div class="proc-track" id="procTrack">
          <svg class="proc-line" id="procLine" aria-hidden="true"><path class="bg"/><path class="fg"/></svg>
        </div>
      </div>
      <div class="wrap">
        <div class="proc-meta" aria-hidden="true">
          <span class="proc-count"><b id="procNow">01</b> / 05</span>
          <span class="proc-bar"><i id="procBar"></i></span>
          <span class="proc-hint"><span class="d">Cuộn để đi tiếp</span><span class="m">Vuốt ngang để xem tiếp</span></span>
        </div>
      </div>
    </div>
  </div>
</section>
