<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<title>Navélia 62 — teaser lễ hạ thủy du thuyền 16:9 (concept)</title>
<link rel="stylesheet" href="../../css/fonts.css"><link rel="stylesheet" href="lib.css">
<style>
:root{--i:#f6ead8;--au:#f2b872}
#stage{background:#05070d;color:var(--i);font-family:"Be Vietnam Pro",sans-serif}
#sky{position:absolute;left:0;right:0;top:0;height:432px;background:linear-gradient(#0a1024 0%,#1b2244 34%,#5a3d5c 62%,#c96f4e 86%,#f3a55e 100%)}
#sunglow{position:absolute;left:880px;top:432px;width:900px;height:520px;margin:-260px -450px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,200,120,.75),rgba(255,140,70,.28) 40%,rgba(255,120,60,0) 72%)}
#sun{position:absolute;left:880px;top:420px;width:84px;height:84px;margin:-42px;border-radius:50%;background:radial-gradient(circle,#fff6da 0 42%,#ffd58c 62%,#ffb25e 100%);box-shadow:0 0 42px 10px rgba(255,190,110,.6)}
.cl{position:absolute;height:6px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(255,170,110,.6),transparent);filter:blur(2.5px)}
#skyclip{position:absolute;left:0;right:0;top:0;height:432px;overflow:hidden}
#sea{position:absolute;left:0;right:0;top:432px;bottom:0;background:linear-gradient(#b0684c 0%,#3b3350 9%,#141a33 34%,#070b18 100%)}
canvas#fx{top:432px!important;height:288px!important}
#hz{position:absolute;left:0;right:0;top:431px;height:1.5px;background:linear-gradient(90deg,transparent,#ffe2b0 30%,#fff3d6 69%,transparent);transform-origin:68.75% 50%}
svg#art{position:absolute;inset:0;width:1280px;height:720px;overflow:visible}
.top{position:absolute;left:68px;right:68px;top:68px;display:flex;justify-content:space-between;font-size:13px;letter-spacing:.42em;text-transform:uppercase}
.top span:last-child{opacity:.55}
.coord{position:absolute;left:68px;top:100px;font:400 13px/1 "Space Mono",monospace;letter-spacing:.14em;color:var(--au)}
.specs{position:absolute;left:68px;top:548px;display:flex;gap:42px}
.specs div{padding-left:26px;border-left:1px solid rgba(246,234,216,.35)}
.specs b{display:block;font:300 53px/1 "Unbounded",sans-serif;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.specs b small{font:400 20px/1 "Be Vietnam Pro";margin-left:6px;color:var(--au)}
.specs>div>span{display:block;margin-top:10px;font-size:13px;letter-spacing:.28em;text-transform:uppercase;opacity:.7}
.ttl{position:absolute;left:0;right:0;top:90px;text-align:center}
.ttl h1{font:200 92px/1 "Unbounded",sans-serif;letter-spacing:.24em;text-indent:.24em;white-space:nowrap}
.ttl h1 i{font:italic 400 126px/.8 "Cormorant",serif;color:var(--au);letter-spacing:0;margin-left:.02em}
.ttl p{margin-top:26px;font:italic 400 33px/1 "Cormorant",serif;display:flex;gap:16px;justify-content:center;align-items:center}
.ttl p b{width:5px;height:5px;border-radius:50%;background:var(--au)}
.inv{position:absolute;left:0;right:0;top:590px;text-align:center}
.inv span{display:inline-block;font-size:13px;font-weight:500;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;padding:16px 42px;border:1px solid rgba(246,234,216,.6);border-radius:99px;background:rgba(8,12,24,.35)}
.lb{position:absolute;left:0;right:0;height:42px;background:#04050a}
#fade{position:absolute;inset:0;background:#04050a}
</style></head>
<body><div id="stage">
 <div id="skyclip"><div id="sky"></div><div id="sunglow"></div><div id="sun"></div>
  <div class="cl" style="left:520px;top:352px;width:520px"></div><div class="cl" style="left:760px;top:384px;width:420px"></div><div class="cl" style="left:160px;top:330px;width:360px;opacity:.5"></div><div class="cl" style="left:940px;top:300px;width:300px;opacity:.4"></div></div>
 <div id="sea"></div><canvas id="fx" width="1280" height="288"></canvas>
 <svg id="art" viewBox="0 0 1280 720"></svg>
 <div id="hz"></div>
 <div class="top"><span>Navélia Yachts</span><span>Teaser · Concept</span></div>
 <div class="coord"></div>
 <div class="specs"><div><b><span class="n1">0</span><small>m</small></b><span>Chiều dài</span></div><div><b><span class="n2">0</span><small>cabin</small></b><span>Phòng chủ &amp; khách</span></div><div><b><span class="n3">0</span><small>hải lý</small></b><span>Tầm hoạt động</span></div></div>
 <div class="ttl"><h1><span class="t1">NAVÉLIA</span><i class="t2">62</i></h1><p><span>Lễ hạ thủy</span><b></b><span>20 tháng 12</span><b></b><span>Vịnh Nha Trang</span></p></div>
 <div class="inv"><span>Thư mời riêng</span></div>
 <div class="lb" style="top:0"></div><div class="lb" style="bottom:0"></div>
 <div id="fade"></div>
</div>
<script src="../../vendor/gsap.min.js"></script><script src="lib.js"></script>
<script>
const W=1280,H=720,DUR=8,HZ=432,SX=880;R2.init({W,H,dur:DUR,poster:6.2});
/* du thuyền: dáng nghiêng vẽ bằng path, mũi hướng phải */
const yacht=`<path d="M-206 0 L-214 -22 L-156 -27 L118 -29 L232 -38 L178 0Z"/><path d="M-150 -27 L-142 -50 L104 -50 L140 -29Z"/><path d="M-112 -50 L-104 -70 L62 -70 L92 -50Z"/><path d="M-62 -70 L-55 -86 L24 -86 L44 -70Z"/><path d="M-24 -86 L-17 -102 L6 -102 L1 -86Z"/><path d="M-9 -102 L-8 -124 L-6 -124 L-5 -102Z"/><path d="M-30 -108 L18 -108 L18 -106 L-30 -106Z"/>`;
let win='';for(let i=0;i<14;i++)win+=`<rect class="wn" x="${-128+i*16}" y="-43" width="10" height="5" rx="1"/>`;for(let i=0;i<9;i++)win+=`<rect class="wn" x="${-92+i*16}" y="-63" width="10" height="4.5" rx="1"/>`;for(let i=0;i<4;i++)win+=`<rect class="wn" x="${-44+i*18}" y="-81" width="12" height="4" rx="1"/>`;
let cticks='';for(let i=0;i<72;i++){const a=i*5*Math.PI/180,r1=i%6?80:74;cticks+=`<line x1="${(r1*Math.sin(a)).toFixed(1)}" y1="${(-r1*Math.cos(a)).toFixed(1)}" x2="${(86*Math.sin(a)).toFixed(1)}" y2="${(-86*Math.cos(a)).toFixed(1)}"/>`}
document.getElementById('art').innerHTML=`<defs><filter id="b2"><feGaussianBlur stdDeviation="2.2 1"/></filter><linearGradient id="rf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="rm"><rect x="-260" y="0" width="520" height="90" fill="url(#rf)"/></mask></defs>
<g id="boat" transform="translate(150 ${HZ+3})">
 <g mask="url(#rm)"><g transform="scale(1 -.8)" fill="#05070f" opacity=".62" filter="url(#b2)">${yacht}</g><g transform="scale(1 -.8)" fill="#ffc98a" opacity=".5" filter="url(#b2)">${win}</g></g>
 <g fill="#070a14">${yacht}</g><path d="M-214 -22 L-156 -27 L118 -29 L232 -38" fill="none" stroke="#ffc48a" stroke-opacity=".55" stroke-width="1"/><path d="M-104 -70 L62 -70 M-55 -86 L24 -86 M-142 -50 L104 -50" fill="none" stroke="#ffc48a" stroke-opacity=".35" stroke-width=".8"/>
 <g fill="#ffd9a0">${win}</g>
 <path class="wake" d="M-214 1 C-300 2 -420 2 -560 1" stroke="#ffe7c2" stroke-opacity=".5" stroke-width="1.4" fill="none"/>
</g>
<g id="cmp" transform="translate(1120 196)" fill="none" stroke="#f6ead8"><circle class="cr" r="86" stroke-opacity=".7" stroke-width="1"/><g class="ct" stroke-opacity=".7" stroke-width="1">${cticks}</g>
 <g class="needle"><path d="M0 -62 L7 0 L0 14 L-7 0Z" fill="#f2b872" stroke="none"/><path d="M0 62 L5 0 L-5 0Z" fill="#f6ead8" fill-opacity=".35" stroke="none"/></g><circle r="3" fill="#05070d" stroke="#f2b872" stroke-width="1.5"/>
 <text class="hd" y="118" text-anchor="middle" font-family="Space Mono" font-size="13" letter-spacing="2" fill="#f6ead8" stroke="none">HDG 000,0°</text></g>`;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
/* mặt biển: vệt sáng lấp lánh theo phối cảnh, dày đặc dưới mặt trời */
const cv=$('#fx'),cx=cv.getContext('2d'),rnd=R2.rng(5),dash=[];
for(let i=0;i<340;i++){const d=Math.pow(rnd(),1.7);dash.push({d,x:rnd()*1600-160,ph:rnd()*6.28,sp:.6+rnd()*1.2,w:rnd()})}
const st={sea:0,n1:0,n2:0,n3:0,hd:0,bx:150};
R2.frame(t=>{cx.clearRect(0,0,W,288);
  for(const q of dash){const y=3+q.d*280,persp=.25+q.d*1.6,x=((q.x+t*14*persp*q.sp)%1600+1600)%1600-160,dx=Math.abs(x-SX)/(60+q.d*240),sun=Math.exp(-dx*dx);
    const tw=.5+.5*Math.sin(t*2.1*q.sp+q.ph),a=st.sea*(sun*(.25+.7*tw)+.05+.07*tw)*(1-q.d*.35);if(a<.01)continue;
    cx.fillStyle=sun>.25?`rgba(255,${200+Math.round(40*tw)},${140+Math.round(60*sun)},${a.toFixed(3)})`:`rgba(170,180,220,${(a*.8).toFixed(3)})`;
    const len=(10+q.w*30)*persp;cx.fillRect(x-len/2,y,len,1+q.d*1.6)}
  $('.n1').textContent=Math.round(st.n1);$('.n2').textContent=Math.round(st.n2);$('.n3').textContent=Math.round(st.n3).toLocaleString('de-DE');
  $('.hd').textContent='HDG '+st.hd.toFixed(1).replace('.',',').padStart(5,'0')+'°';$('.needle').setAttribute('transform',`rotate(${st.hd.toFixed(2)})`);
  $('#boat').setAttribute('transform',`translate(${st.bx.toFixed(2)} ${(HZ+3+Math.sin(t*1.3)*1.2).toFixed(2)}) rotate(${(Math.sin(t*1.1)*.35).toFixed(3)}) scale(1.3)`);
  $$('.wn').forEach((e,i)=>e.setAttribute('opacity',(.75+.25*Math.sin(t*3+i*1.9)).toFixed(2)))});
const CO='12°14′ B   109°11′ Đ',co=$('.coord'),ty={n:0};
const t1=R2.split($('.t1')),sp=$$('.ttl p>*');
const tl=gsap.timeline({paused:true,defaults:{ease:'power3.out'}});
gsap.set('.lb',{scaleY:0});gsap.set($('.lb'),{transformOrigin:'50% 0'});gsap.set($$('.lb')[1],{transformOrigin:'50% 100%'});
gsap.set(['.specs>div','.inv','.ttl p>*'],{opacity:0});gsap.set('.t2',{opacity:0});gsap.set(t1,{opacity:0});
gsap.set('.cr',{attr:{'stroke-dasharray':'541 541','stroke-dashoffset':541}});gsap.set(['.ct','.needle','.hd'],{opacity:0});
tl.to('#fade',{opacity:0,duration:1.11,ease:'power1.out'},0)
  .fromTo('#hz',{scaleX:0},{scaleX:1,duration:1.796,ease:'expo.out'},.1)
  .fromTo('#sun',{y:26},{y:0,duration:DUR,ease:'none'},0).fromTo('#sunglow',{scale:.7,opacity:.6},{scale:1.08,opacity:1,duration:DUR,ease:'sine.inOut'},0)
  .fromTo('.cl',{x:0},{x:i=>(i%2?-26:42),duration:DUR,ease:'none'},0)
  .to(st,{sea:1,duration:1.796,ease:'power1.out'},.2)
  .to(st,{bx:560,duration:DUR,ease:'none'},0)
  .fromTo('.top span',{opacity:0,y:-10},{opacity:i=>i?.55:1,y:0,duration:.686,stagger:.1},.4)
  .to(ty,{n:CO.length,duration:1.11,ease:'none',onUpdate:()=>co.textContent=CO.slice(0,Math.round(ty.n))},.6)
  /* la bàn: góc vàng 137,5° */
  .to('.cr',{attr:{'stroke-dashoffset':0},duration:1.11,ease:'power2.inOut'},.9).to(['.ct','.needle','.hd'],{opacity:1,duration:.424,stagger:.1},1.3)
  .fromTo('.ct',{rotation:-60,svgOrigin:'0 0'},{rotation:0,duration:1.796,ease:'power3.out'},1.3)
  .to(st,{hd:137.5,duration:1.796,ease:'power3.inOut'},1.4)
  /* thông số */
  .to('.specs>div',{opacity:1,duration:.686,stagger:.162},1.9).fromTo('.specs>div',{y:26},{y:0,duration:.686,stagger:.162},1.9)
  .to(st,{n1:62,duration:1.11,ease:'power2.out'},1.9).to(st,{n2:5,duration:.9,ease:'power2.out'},2.06).to(st,{n3:4200,duration:1.3,ease:'power2.out'},2.22)
  .to('.specs>div',{opacity:0,y:-16,duration:.424,ease:'power2.in',stagger:.062},4.1)
  .to(['#cmp','.coord','.top'],{opacity:0,duration:.424},4.2)
  /* tiêu đề */
  .to('.lb',{scaleY:1,duration:1.11,ease:'power3.inOut'},4.1)
  .fromTo(t1,{opacity:0,y:42,filter:'blur(8px)'},{opacity:1,y:0,filter:'blur(0px)',duration:.9,stagger:.062},4.4)
  .fromTo('.t2',{opacity:0,x:-26},{opacity:1,x:0,duration:.9},5.0)
  .to(sp,{opacity:1,duration:.686,stagger:.1},5.3).fromTo(sp,{y:16},{y:0,duration:.686,stagger:.1},5.3)
  .fromTo('.inv',{opacity:0,y:16},{opacity:1,y:0,duration:.686},5.9)
  .to('#fade',{opacity:1,duration:.5,ease:'power1.in'},DUR-.5);
R2.done(tl);
</script></body></html>
