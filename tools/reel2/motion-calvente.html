<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<title>Calvente — kinetic typography giày thủ công 9:16 (concept)</title>
<link rel="stylesheet" href="../../css/fonts.css"><link rel="stylesheet" href="lib.css">
<style>
:root{--k:#0e0d0c;--b:#efe8dc;--ox:#7a1626;--ox2:#a3233a}
#stage{background:var(--k);color:var(--b);font-family:"Be Vietnam Pro",sans-serif}
.sc{position:absolute;inset:0;overflow:hidden;visibility:hidden}
.A{font-family:"Anton",sans-serif;text-transform:uppercase;line-height:.92;white-space:nowrap;position:absolute}
.P{font-family:"Playfair",serif;font-style:italic;position:absolute;white-space:nowrap}
.M{font-family:"Space Mono",monospace;font-size:16px;letter-spacing:.12em;text-transform:uppercase;position:absolute}
.out{color:transparent;-webkit-text-stroke:2px currentColor}
#s1{background:var(--k)} #s2{background:var(--b);color:var(--k)} #s3{background:var(--ox);color:var(--b)} #s4{background:var(--k)} #s5{background:var(--b);color:var(--k)}
#s1 .di{left:36px;top:150px} #s1 .cham{left:42px;top:820px;letter-spacing:.02em}
#s1 .bar{position:absolute;left:42px;top:770px;height:10px;width:636px;background:var(--ox2);transform-origin:0 50%}
#s2 .den{left:36px;top:176px} #s2 .xa{left:42px;top:640px} #s2 .xa.e{-webkit-text-stroke:2px var(--k);color:transparent}
#s2 .ar{position:absolute;left:42px;top:590px;height:6px;width:636px;background:var(--k);transform-origin:0 50%}
#s3 .num{left:0;right:0;top:330px;text-align:center;font-size:420px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
#s3 .lab{left:0;right:0;top:760px;text-align:center;font-size:68px}
#s3 .mq{font-size:110px;left:0;-webkit-text-stroke:2px rgba(239,232,220,.55);color:transparent}
#s3 svg{position:absolute;left:0;top:722px;width:720px;height:20px}
#s4 .fl{left:0;right:0;text-align:center;top:200px;color:var(--ox2)}
#s4 svg{position:absolute;left:40px;top:560px;width:640px;height:300px;overflow:visible}
#s4 .cap{left:0;right:0;top:940px;text-align:center;font-size:42px}
#s5 .wm{left:0;right:0;top:330px;text-align:center}
#s5 .tg{left:0;right:0;top:640px;text-align:center;font-size:68px}
#s5 .ln{position:absolute;left:50%;top:600px;width:262px;height:6px;margin-left:-131px;background:var(--ox)}
#s5 .ft{left:0;right:0;top:1120px;text-align:center;font-size:16px;opacity:.6}
#s5 svg{position:absolute;left:150px;top:830px;width:420px;height:197px;overflow:visible}
.hud{z-index:5;mix-blend-mode:difference;color:#fff}
.hud.tl{left:42px;top:42px}.hud.tr{right:42px;top:42px;text-align:right}.hud.bl{left:42px;bottom:42px}.hud.br{right:42px;bottom:42px}
#wipe{position:absolute;inset:0;z-index:4}
#cut{position:absolute;inset:0;background:#000;opacity:0;z-index:9}
</style></head>
<body><div id="stage">
 <div class="sc" id="s1"><div class="A di">ĐI</div><div class="bar"></div><div class="A cham">CHẬM.</div></div>
 <div class="sc" id="s2"><div class="A den">ĐẾN</div><div class="ar"></div><div class="A xa e">XA.</div><div class="A xa e">XA.</div><div class="A xa e">XA.</div><div class="A xa e">XA.</div><div class="A xa m">XA.</div></div>
 <div class="sc" id="s3"><div class="A mq m1">DA BÊ NGUYÊN TẤM · DA BÊ NGUYÊN TẤM · DA BÊ NGUYÊN TẤM · </div><div class="A num">0</div>
  <svg viewBox="0 0 720 20"><path class="stitch" d="M42 10 H678" fill="none" stroke="#efe8dc" stroke-width="4" stroke-dasharray="26 16" stroke-linecap="round"/></svg>
  <div class="P lab">mũi khâu tay</div><div class="A mq m2">MỘT ĐÔI · MỘT NGHỆ NHÂN · MỘT ĐÔI · MỘT NGHỆ NHÂN · </div></div>
 <div class="sc" id="s4"><div class="A fl f1">KHÂU.</div><div class="A fl f2">MÀI.</div><div class="A fl f3">BÓNG.</div><svg viewBox="0 0 640 300" class="shoe"></svg><div class="P cap">Tám tuần cho một đôi giày.</div></div>
 <div class="sc" id="s5"><div class="A wm">CALVENTE</div><div class="ln"></div><div class="P tg">Đi chậm. Đến xa.</div><svg viewBox="0 0 640 300" class="shoe"></svg><div class="M ft">Giày thủ công · Concept</div></div>
 <div id="wipe"></div>
 <div class="M hud tl">Calvente</div><div class="M hud tr" id="tc">00:00</div><div class="M hud bl" id="idx">01 / 05</div><div class="M hud br">FW — Bespoke</div>
 <div id="cut"></div>
</div>
<script src="../../vendor/gsap.min.js"></script><script src="lib.js"></script>
<script>
const W=720,H=1280,DUR=7;R2.init({W,H,dur:DUR,poster:6.3,cover:[.95,3.6,6.3]});
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
/* dáng giày derby nhìn nghiêng, vẽ bằng path */
const SHOE=`<path class="o up" d="M52 232 L52 208 C40 172 42 112 68 74 C74 64 88 62 98 68 C140 90 190 96 240 100 C262 102 274 108 292 120 C350 156 430 172 506 186 C552 194 590 204 592 220 C592 228 584 232 570 232 Z"/>
 <path class="o" d="M52 238 H580 C590 238 596 244 592 252 H52 Z"/><path class="o" d="M52 252 H166 V270 H56 C53 270 52 268 52 265 Z"/>
 <path class="o d" d="M462 178 C472 194 474 214 466 232"/><path class="o d" d="M240 100 C250 150 276 198 306 232"/>
 <path class="o d" d="M262 118 l22 -14 M282 130 l22 -14 M302 141 l22 -14 M322 151 l22 -14"/>
 <path class="o st" d="M70 84 C100 104 170 112 228 114" stroke-dasharray="7 7"/>`;
$$('.shoe').forEach(s=>s.innerHTML=SHOE);
gsap.set('.o',{fill:'none',stroke:'currentColor',strokeWidth:4,strokeLinejoin:'round',strokeLinecap:'round'});gsap.set('.o.st',{strokeWidth:2.5});
const fit=(el,w)=>{el.style.fontSize='100px';const g=document.createRange();g.selectNodeContents(el);const r=g.getBoundingClientRect().width;el.style.fontSize=(100*w/r).toFixed(1)+'px'};
R2.ready=Promise.all([document.fonts.load('400 100px Anton','ĐẾN CHẬM'),document.fonts.load('italic 400 60px Playfair','Đến chậm'),document.fonts.load('400 16px "Space Mono"','a')]).then(()=>{
fit($('.di'),440);fit($('.cham'),636);fit($('.den'),648);$$('.xa').forEach(e=>fit(e,400));fit($('.wm'),620);$$('.fl').forEach(e=>fit(e,620));
const cham=R2.split($('.cham')),den=R2.split($('.den')),wm=R2.split($('.wm')),tg=R2.split($('.tg'),'words'),cap=R2.split($('.cap'),'words'),lab=R2.split($('.lab'),'words');
$$('#s4 .o:not(.st)').forEach(p=>{const L=p.getTotalLength();p.style.strokeDasharray=L+2;p.style.strokeDashoffset=L+2});
const tl=window.TL,st={n:0};
const T=[0,1.42,2.72,4.3,5.5];            /* nhịp cắt cảnh */
const show=(i,t)=>{tl.set('#s'+i,{visibility:'visible'},t);if(i>1)tl.set('#s'+(i-1),{visibility:'hidden'},t);tl.call(()=>{},null,t)};
gsap.set('#wipe',{yPercent:101});const wipe=(col,t)=>tl.set('#wipe',{background:col},t-.2).fromTo('#wipe',{yPercent:101},{yPercent:0,duration:.2,ease:'power3.in',immediateRender:false},t-.2).to('#wipe',{yPercent:-101,duration:.3,ease:'power3.out'},t);
R2.frame(t=>{$('#tc').textContent='00:0'+Math.floor(t)+':'+String(Math.floor(t%1*30)).padStart(2,'0');let i=0;T.forEach((x,j)=>{if(t>=x)i=j});$('#idx').textContent='0'+(i+1)+' / 05';$('.num').textContent=Math.round(st.n)});
/* 1 — ĐI CHẬM. */
show(1,0);
tl.fromTo('.di',{scale:3.2,opacity:0,transformOrigin:'0% 50%'},{scale:1,opacity:1,duration:.424,ease:'expo.out'},.06)
  .fromTo('#s1 .bar',{scaleX:0},{scaleX:1,duration:.9,ease:'none'},.3)
  .fromTo(cham,{opacity:0,y:68},{opacity:1,y:0,duration:.262,ease:'power2.out',stagger:.17},.34)
  .to('.di',{x:-26,duration:1.4,ease:'none'},.06).to('.cham',{letterSpacing:'.06em',duration:1.2,ease:'none'},.3);
/* 2 — ĐẾN XA. */
wipe('#efe8dc',T[1]);show(2,T[1]);
tl.fromTo(den,{yPercent:120},{yPercent:0,duration:.424,ease:'expo.out',stagger:.062},T[1]+.05)
  .fromTo('#s2 .ar',{scaleX:0},{scaleX:1,duration:.686,ease:'expo.inOut'},T[1]+.2)
  .fromTo('.xa.m',{x:-460},{x:236,duration:.9,ease:'expo.out'},T[1]+.3);
$$('.xa.e').forEach((e,i)=>tl.fromTo(e,{x:-460,opacity:0},{x:236-(4-i)*56,opacity:.2+.14*i,duration:.9,ease:'expo.out'},T[1]+.3+i*.02));
tl.to('.den',{x:16,duration:1.2,ease:'none'},T[1]+.1);
/* 3 — 212 mũi khâu tay */
wipe('#7a1626',T[2]);show(3,T[2]);
gsap.set('.m1',{top:96});gsap.set('.m2',{top:1010});
tl.to(st,{n:212,duration:1.0,ease:'power3.out'},T[2]+.05)
  .fromTo('.num',{scale:.7},{scale:1,duration:1.2,ease:'expo.out'},T[2]+.05)
  .fromTo('.stitch',{strokeDashoffset:680,strokeDasharray:'26 16'},{strokeDashoffset:0,duration:1.0,ease:'none'},T[2]+.2)
  .fromTo(lab,{opacity:0,y:26},{opacity:1,y:0,duration:.424,stagger:.1},T[2]+.55)
  .fromTo('.m1',{x:0},{x:-420,duration:1.7,ease:'none'},T[2]-.1).fromTo('.m2',{x:-520},{x:-100,duration:1.7,ease:'none'},T[2]-.1);
/* 4 — KHÂU. MÀI. BÓNG. + dáng giày tự vẽ */
wipe('#0e0d0c',T[3]);show(4,T[3]);
gsap.set('.fl',{opacity:0});
['.f1','.f2','.f3'].forEach((s,i)=>{const t=T[3]+.08+i*.3;tl.set(s,{opacity:1},t).fromTo(s,{scale:1.25},{scale:1,duration:.3,ease:'expo.out'},t);if(i<2)tl.set(s,{opacity:0},t+.3)});
tl.to('#s4 .o:not(.st)',{strokeDashoffset:0,duration:.9,ease:'power2.inOut',stagger:.05},T[3]+.1)
  .fromTo('#s4 .o.st',{opacity:0},{opacity:1,duration:.262},T[3]+.9)
  .to('#s4 .o.up',{fill:'#efe8dc',fillOpacity:.1,duration:.424},T[3]+.9)
  .fromTo('#s4 .shoe',{x:-26},{x:16,duration:1.3,ease:'none'},T[3])
  .fromTo(cap,{opacity:0,y:16},{opacity:1,y:0,duration:.262,stagger:.062},T[3]+.5);
/* 5 — logo kết */
wipe('#efe8dc',T[4]);show(5,T[4]);
tl.fromTo(wm,{yPercent:110,opacity:0},{yPercent:0,opacity:1,duration:.424,ease:'expo.out',stagger:.045},T[4]+.05)
  .fromTo('#s5 .ln',{scaleX:0},{scaleX:1,duration:.686,ease:'expo.inOut'},T[4]+.3)
  .fromTo(tg,{opacity:0,y:26},{opacity:1,y:0,duration:.424,stagger:.1},T[4]+.45)
  .fromTo('#s5 .shoe',{opacity:0,x:-42},{opacity:1,x:0,duration:.686,ease:'power3.out'},T[4]+.6)
  .fromTo('#s5 .ft',{opacity:0},{opacity:.6,duration:.424},T[4]+.8)
  .to('.wm',{letterSpacing:'.012em',duration:1.4,ease:'none'},T[4]+.1)
  .to('#cut',{opacity:1,duration:.1},DUR-.1);
});
window.TL=gsap.timeline({paused:true});
R2.done(window.TL);
</script></body></html>
